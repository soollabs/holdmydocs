<!doctype html>
<!-- Open locally in a browser at 1280 × 760 and capture the viewport to regenerate hero.png. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold My Docs desktop and mobile preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 760px; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(ellipse at 78% 18%, #506b87 0%, transparent 46%),
        radial-gradient(ellipse at 18% 91%, #34475c 0%, transparent 55%),
        #182433;
      font-family: system-ui, sans-serif;
    }
    .glow {
      position: absolute;
      inset: 95px 55px 30px;
      border-radius: 60px;
      background: #b9d4fa;
      filter: blur(90px);
      opacity: .18;
    }
    .desktop {
      position: absolute;
      left: 55px;
      top: 64px;
      width: 1008px;
      height: 672px;
      overflow: hidden;
      border: 1px solid #8c9baf;
      border-radius: 16px;
      background: #2e3440;
      box-shadow: 0 35px 75px #070d19a8, 0 0 0 1px #fff2;
    }
    .browser-bar {
      display: flex;
      align-items: center;
      height: 37px;
      padding: 0 16px;
      gap: 7px;
      background: #384253;
      border-bottom: 1px solid #566276;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #8c9bb0; }
    .address {
      margin: auto;
      width: 280px;
      padding: 4px;
      border-radius: 5px;
      color: #c8d2df;
      background: #273242;
      text-align: center;
      font-size: 11px;
      letter-spacing: .02em;
    }
    .spacer { width: 27px; }
    .desktop img { display: block; width: 100%; height: auto; }
    .phone {
      position: absolute;
      left: 926px;
      top: 154px;
      width: 297px;
      height: 538px;
      padding: 10px;
      border: 2px solid #687789;
      border-radius: 43px;
      background: #101823;
      box-shadow: 0 32px 65px #030a15bc, inset 0 0 0 2px #303d4b, 0 0 0 1px #dbe7fb60;
    }
    .screen { height: 100%; overflow: hidden; border-radius: 33px; background: #0b0f14; }
    .screen img { display: block; width: 100%; height: auto; }
    .camera {
      position: absolute;
      left: 94px;
      top: 9px;
      width: 105px;
      height: 19px;
      border-radius: 0 0 12px 12px;
      background: #101823;
    }
    .camera::after {
      content: "";
      position: absolute;
      left: 45px;
      top: 5px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #334457;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="desktop">
    <div class="browser-bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <div class="address">Hold My Docs</div><span class="spacer"></span>
    </div>
    <img src="screenshots/09-field-lab-desktop.png" alt="A fictional Field Lab wiki on desktop">
  </div>
  <div class="phone">
    <div class="screen"><img src="screenshots/10-field-lab-mobile.png" alt="The same fictional Field Lab wiki on mobile"></div>
    <div class="camera"></div>
  </div>
</body>
</html>
