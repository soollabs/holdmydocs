{{define "widget-keys"}}
<div class="sidebar-hints">
	<a href="/_/settings" class="collapsed-gear" aria-label="Settings">⚙</a>
	<div class="hint-row">
		<a href="/_/settings">settings</a> · <a href="/_/admin">admin</a> · <a href="/_/hidden/help">? help</a> ·
		<a href="/_/health-report" id="health-line" class="health-hint{{if .HealthMissing}} has-missing{{else if .HealthOrphans}} has-orphans{{end}}" title="{{.HealthMissing}} missing · {{.HealthOrphans}} orphan{{if ne .HealthOrphans 1}}s{{end}}">health</a>
	</div>
	<div class="hint-row">{{if .JournalEnabled}}<kbd>ctrl j</kbd> journal · {{end}}<kbd>ctrl k</kbd> jump / >verbs</div>
	<div class="hint-row sidebar-version">{{.Version}}</div>
</div>
{{end}}
