{{define "widget-inbox"}}
{{if .Inbox}}
<div class="sidebar-section sidebar-inbox">
	<h2>INBOX · {{len .Inbox}} UNREAD</h2>
	<ul class="inbox-list">
		{{range .Inbox}}
		<li><a href="/{{.Slug}}">{{.Title}}</a>{{if .ReadTime}}<span class="inbox-meta">{{.ReadTime}}</span>{{end}}</li>
		{{end}}
	</ul>
</div>
{{end}}
{{end}}
