{{define "widget-namespaces"}}
{{if .NamespaceNav}}
<div class="sidebar-section sidebar-namespaces">
	<h2>NAMESPACES</h2>
	<ul class="sidebar-list">
		{{range .NamespaceNav}}
		<li><a href="/{{.Name}}/"{{if .Active}} class="active"{{end}}>{{.Name}}/<span class="count"> {{.Count}}</span></a></li>
		{{end}}
	</ul>
	{{if .CanSettings}}<a href="/_/namespaces">View all</a>{{end}}
</div>
{{end}}
{{end}}
