name: Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/soollabs/holdmydocs

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  vet:
    uses: ./.github/workflows/vet.yml

  build:
    needs: [lint, test, vet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, vet]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="hmd-${VERSION}-${os}-${arch}"
            mkdir -p "dist/$name"
            binary=hmd
            if [ "$os" = windows ]; then binary=hmd.exe; fi
            GOOS="$os" GOARCH="$arch" go build \
              -tags timetzdata -trimpath \
              -ldflags="-s -w -X hmd/internal/app.buildVersion=$VERSION" \
              -o "dist/$name/$binary" ./cmd/hmd
            cp LICENSE README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd "dist/$name" && zip -q "../$name.zip" "$binary" LICENSE README.md)
            else
              tar -C "dist/$name" -czf "dist/$name.tar.gz" "$binary" LICENSE README.md
            fi
            rm -r "dist/$name"
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --generate-notes
          fi
          gh release upload "$VERSION" dist/* --clobber
