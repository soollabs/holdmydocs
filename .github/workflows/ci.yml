name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  go-checks:
    uses: ./.github/workflows/go-checks.yml

  js-tests:
    uses: ./.github/workflows/js-tests.yml

  container:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [go-checks, js-tests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      publish: true

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    needs: [go-checks, js-tests, container]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
