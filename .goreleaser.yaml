version: 2
project_name: hmd

builds:
  - main: ./cmd/hmd
    binary: hmd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    tags: [timetzdata]
    flags: [-trimpath]
    ldflags:
      - -s -w -X hmd/internal/app.buildVersion={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: "hmd-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: SHA256SUMS

release:
  prerelease: auto
  preflight:
    fail_on_error: true
