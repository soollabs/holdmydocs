version: 2
project_name: hmd

builds:
  - main: ./cmd/hmd
    binary: hmd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    tags: [timetzdata]
    flags: [-trimpath]
    ldflags:
      - -s -w -X hmd/internal/app.buildVersion={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: "hmd-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: SHA256SUMS

changelog:
  groups:
    - title: Features
      regexp: '^feat(\([[:word:]-]+\))?!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^fix(\([[:word:]-]+\))?!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^docs?(\([[:word:]-]+\))?!?:.+$'
      order: 2
    - title: Dependencies
      regexp: '^chore\(deps\)!?:.+$'
      order: 3
    - title: Other Changes
      order: 999

release:
  draft: true
  prerelease: auto
  preflight:
    fail_on_error: true
