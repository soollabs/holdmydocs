{{define "widget-backlinks"}}
{{if .Backlinks}}
{{$linksPanel := component "panel" "variant" "default"}}{{template "ui-panel-start" $linksPanel}}<footer class="backlinks-footer">
	<div class="backlinks-label">{{t "widget.backlinks.label"}}</div>
	<div class="backlinks-row">
	{{range .Backlinks}}
		<a href="{{pageurl .Slug}}">{{.Title}}</a>
	{{end}}
	</div>
</footer>{{template "ui-panel-end" $linksPanel}}
{{end}}
{{end}}
