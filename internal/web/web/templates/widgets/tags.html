{{define "widget-tags"}}
{{if .AllTags}}
<div class="sidebar-section sidebar-tags-section">
	<h2>TAGS</h2>
	<ul class="tag-chips">
		{{range .AllTags}}
		<li><a href="/_/tags/{{.Slug}}">{{.Tag}}<span class="count">{{.Count}}</span></a></li>
		{{end}}
		<li><a href="/_/tags" class="all-link">▸ all</a></li>
	</ul>
</div>
{{end}}
{{end}}
