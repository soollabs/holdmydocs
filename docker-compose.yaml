services:
  hmd:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GOMEMLIMIT: 384MiB
      HMD_ADMIN_USER: "${HMD_ADMIN_USER:?set HMD_ADMIN_USER}"
      HMD_ADMIN_PASSWORD: "${HMD_ADMIN_PASSWORD:?set HMD_ADMIN_PASSWORD}"
      # Optional: sync content to a Git remote. Create ./git_token.txt, then
      # uncomment these and the service `secrets` entry below.
      # HMD_GIT_REMOTE_URL: "https://git.example.com/you/wiki.git"
      # HMD_GIT_USER: "you"
      # HMD_GIT_TOKEN_FILE: "/run/secrets/git_token"
      # Uncomment with `--profile documents` to enable extraction/search.
      # HMD_TIKA_URL: "http://tika:9998"
    volumes:
      # Content repository — safe on NFS-backed storage, git only.
      - repo:/data/repo
      # App state (users.json) — MUST be local disk, never NFS.
      - app:/data/app
    # secrets:
    #   - git_token
    networks:
      - default
      - tika
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    healthcheck:
      test: ["CMD", "/hmd", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional document extraction service. It is internal-only by default.
  tika:
    profiles: [documents]
    image: apache/tika:3.3.1.0-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
    user: "35002:35002"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777,nosuid,nodev,noexec
    networks: [tika]

# secrets:
#   git_token:
#     file: ./git_token.txt

volumes:
  repo:
  app:

networks:
  tika:
    internal: true
